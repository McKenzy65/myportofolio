<div id="edit-certification-modal" class="certification-form-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="edit-certification-title">
    <button type="button" class="certification-form-modal__backdrop"
            popovertarget="edit-certification-modal" popovertargetaction="hide"
            aria-label="Tutup form edit sertifikasi"></button>
    <div class="certification-form-modal__content">
        <button type="button" class="certification-form-modal__close"
                popovertarget="edit-certification-modal" popovertargetaction="hide"
                aria-label="Tutup form edit sertifikasi">&times;</button>
        <h2 id="edit-certification-title">Edit Sertifikasi</h2>
        <p id="edit-certification-status" role="status" aria-live="polite"></p>
        <form id="edit-certification-form">
            <fieldset disabled>
                <div class="form-group">
                    <label for="edit-certification-name">Judul</label>
                    <input id="edit-certification-name" name="title" maxlength="255" required>
                </div>
                <div class="form-group">
                    <label for="edit-certification-description">Deskripsi</label>
                    <textarea id="edit-certification-description" name="description" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-certification-year">Tahun</label>
                    <input id="edit-certification-year" name="year" type="number" min="0" max="2147483647" required>
                </div>
                <div class="form-group">
                    <label for="edit-certification-highlight" class="form-check">
                        <input id="edit-certification-highlight" name="is_highlight" type="checkbox"> Unggulan
                    </label>
                </div>
                <button type="submit" class="button">Simpan Perubahan</button>
            </fieldset>
            <div class="certification-form-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="edit-certification-modal" popovertargetaction="hide">Tutup</button>
            </div>
        </form>
    </div>
</div>
