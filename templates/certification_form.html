{% extends "base.html" %}

{% block meta %}
<title>Tambah Sertifikasi - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="section certs">
        <div class="container">
            <h1>Tambah Sertifikasi Baru</h1>
            <form method="post" action="{% url 'main:create_certification' %}">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="button">Simpan</button>
                <a href="{% url 'main:show_certifications' %}" class="button button-secondary">Batal</a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
